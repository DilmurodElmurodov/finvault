version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finvault-postgres
    environment:
      POSTGRES_DB: finvault_db
      POSTGRES_USER: finvault
      POSTGRES_PASSWORD: finvault_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finvault -d finvault_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finvault-network

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: finvault-backend
    ports:
      - "8080:8080"
    environment:
      - DB_USERNAME=finvault
      - DB_PASSWORD=finvault_pass
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/finvault_db
      - JWT_SECRET=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
      - MAIL_HOST=smtp.gmail.com
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - finvault-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: finvault-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - finvault-network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  logs:

networks:
  finvault-network:
    driver: bridge
