server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: finvault-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/finvault_db
    username: ${DB_USERNAME:finvault}
    password: ${DB_PASSWORD:finvault_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@finvault.io}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: simple
    cache-names: users, portfolios, assets

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
  access-token-expiration: 86400000    # 24 hours
  refresh-token-expiration: 604800000  # 7 days

# File Upload
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  max-size: 10485760  # 10MB

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.finvault: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
  file:
    name: logs/finvault.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
